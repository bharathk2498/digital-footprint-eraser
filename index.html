    <style>
        * {
            margin: 0;
            padding: 0;

        :root[data-theme="dark"] {
            --primary-violet: #4C1D95;
            --secondary-violet: #7C3AED;
            --accent-violet: #8B5CF6;
            --electric-violet: #A855F7;

            --bg-gradient-mid: #1a1a2e;
            --bg-gradient-end: #16213e;
        }

        :root[data-theme="light"] {
            --primary-violet: #6D28D9;
            --secondary-violet: #8B5CF6;
            --accent-violet: #A78BFA;
            --electric-violet: #C4B5FD;
            --dark-bg: #F8FAFC;
            --card-bg: rgba(139, 92, 246, 0.05);
            --glass-bg: rgba(139, 92, 246, 0.02);
            --text-primary: #1E293B;
            --text-secondary: #475569;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --glow: 0 0 20px rgba(139, 92, 246, 0.2);
            --glow-intense: 0 0 30px rgba(139, 92, 246, 0.4);
            --bg-gradient-start: #F8FAFC;
            --bg-gradient-mid: #F1F5F9;
            --bg-gradient-end: #E2E8F0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
            background: rgba(139, 92, 246, 0.1);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
        }

        .theme-toggle:hover {
            background: rgba(139, 92, 246, 0.2);
            transform: rotate(180deg);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        /* Keyboard shortcut hint */
        .cmd-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            z-index: 997;
            font-size: 0.85rem;
            color: var(--text-secondary);
            animation: slideInRight 0.5s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cmd-hint kbd {
            padding: 0.2rem 0.5rem;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 4px;
            font-family: monospace;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .social-proof-banner {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            z-index: 998;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideInLeft 0.5s ease;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .live-counter {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: livePulse 2s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .counter-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-violet);
        }

        .counter-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .tooltip {
            position: absolute;
            background: rgba(10, 10, 15, 0.98);
            border: 2px solid rgba(139, 92, 246, 0.4);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            max-width: 250px;
            z-index: 10002;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tooltip.show {
            opacity: 1;
        }

        .tooltip-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .tooltip-arrow.bottom {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0 8px;
            border-color: rgba(139, 92, 246, 0.4) transparent transparent transparent;
        }

        .has-tooltip {
            position: relative;
            cursor: help;
        }

        @media (max-width: 768px) {
            .social-proof-banner { display: none; }
            .cmd-hint { display: none; }
        }
    </style>
