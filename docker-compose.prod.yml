# 🚀 Docker Compose - Production Configuration
# Enterprise-grade multi-service deployment with security hardening

version: '3.8'

services:
  # Main Application
  digital-footprint-eraser:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: dfe-app-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/cache/dfe:noexec,nosuid,size=50m
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Network configuration
    networks:
      - dfe-frontend
      - dfe-backend
    
    ports:
      - "443:8443"
      - "80:8080"
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - SECURITY_LEVEL=military-grade
      - LOG_LEVEL=info
      - QUANTUM_ENABLED=true
      - AI_THREAT_DETECTION=enabled
      - FAMILY_PROTECTION=enabled
      - COMPLIANCE_MODE=strict
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Volume mounts
    volumes:
      - ./logs:/var/log/dfe:rw
      - ./ssl-certs:/etc/ssl/certs:ro
      - ./ssl-private:/etc/ssl/private:ro
    
    depends_on:
      - redis-cache
      - postgres-db
      - ai-service
      - quantum-service

  # Redis Cache for session management
  redis-cache:
    image: redis:7-alpine
    container_name: dfe-redis-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    networks:
      - dfe-backend
    
    # Redis configuration
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    
    volumes:
      - redis-data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: dfe-postgres-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    
    networks:
      - dfe-backend
    
    environment:
      - POSTGRES_DB=dfe_enterprise
      - POSTGRES_USER=dfe_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfe_user -d dfe_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Threat Detection Service
  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: dfe-ai-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    
    # Resource limits (AI needs more resources)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    networks:
      - dfe-backend
    
    environment:
      - AI_MODEL_PATH=/app/models
      - THREAT_DETECTION_ENABLED=true
      - BEHAVIORAL_ANALYSIS_ENABLED=true
      - QUANTUM_AI_ENABLED=true
      - LOG_LEVEL=info
    
    volumes:
      - ai-models:/app/models:ro
      - ./logs/ai:/var/log/ai:rw
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 15s
      retries: 3

  # Quantum Security Service
  quantum-service:
    build:
      context: ./services/quantum
      dockerfile: Dockerfile
    container_name: dfe-quantum-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - dfe-backend
    
    environment:
      - QUANTUM_ALGORITHMS_ENABLED=true
      - POST_QUANTUM_CRYPTO=true
      - QUANTUM_KEY_DISTRIBUTION=enabled
      - LOG_LEVEL=info
    
    volumes:
      - quantum-keys:/app/keys:rw
      - ./logs/quantum:/var/log/quantum:rw
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: dfe-prometheus-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"  # nobody user
    
    networks:
      - dfe-monitoring
      - dfe-backend
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: dfe-grafana-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    user: "472:472"  # grafana user
    
    networks:
      - dfe-monitoring
    
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitoring.dfe.local
      - GF_SECURITY_COOKIE_SECURE=true
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

  # Nginx Load Balancer/Reverse Proxy
  nginx-lb:
    image: nginx:alpine
    container_name: dfe-nginx-prod
    restart: unless-stopped
    
    # Security configuration
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=10m
    
    networks:
      - dfe-frontend
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/nginx.conf:ro
      - ./ssl-certs:/etc/ssl/certs:ro
      - ./ssl-private:/etc/ssl/private:ro
    
    depends_on:
      - digital-footprint-eraser
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Networks
networks:
  dfe-frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dfe-frontend
    ipam:
      config:
        - subnet: 172.20.1.0/24
  
  dfe-backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dfe-backend
    ipam:
      config:
        - subnet: 172.20.2.0/24
  
  dfe-monitoring:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dfe-monitoring
    ipam:
      config:
        - subnet: 172.20.3.0/24

# Volumes
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/dfe/postgres
  
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/dfe/redis
  
  ai-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/dfe/ai-models
  
  quantum-keys:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/dfe/quantum-keys
  
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/dfe/prometheus
  
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/dfe/grafana