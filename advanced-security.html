<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Security - Digital Footprint Eraser</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-violet: #4C1D95;
            --secondary-violet: #7C3AED;
            --accent-violet: #8B5CF6;
            --electric-violet: #A855F7;
            --dark-bg: #0A0A0F;
            --card-bg: rgba(76, 29, 149, 0.1);
            --glass-bg: rgba(139, 92, 246, 0.05);
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --family: #EC4899;
            --sector: #06B6D4;
            --organization: #8B5CF6;
            --glow: 0 0 30px rgba(139, 92, 246, 0.3);
            --glow-intense: 0 0 50px rgba(139, 92, 246, 0.6);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.1; }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            padding: 1rem 2rem;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1800px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: transparent;
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-tab.active {
            background: var(--accent-violet);
            color: white;
            box-shadow: var(--glow);
        }

        .nav-tab:hover:not(.active) {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-violet);
        }

        .advanced-dashboard {
            margin-top: 100px;
            padding: 2rem;
            max-width: 1900px;
            margin-left: auto;
            margin-right: auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .dashboard-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--text-primary), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .paywall-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .paywall-modal {
            background: var(--glass-bg);
            border: 2px solid var(--accent-violet);
            border-radius: 20px;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: var(--glow-intense);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .threat-analyzer {
            background: var(--glass-bg);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .security-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .security-module {
            background: rgba(76, 29, 149, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .security-module:hover {
            transform: scale(1.02);
            box-shadow: var(--glow-intense);
        }

        .family-module {
            border-color: rgba(236, 72, 153, 0.4);
            background: rgba(236, 72, 153, 0.05);
        }

        .sector-module {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(6, 182, 212, 0.05);
        }

        .organization-module {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(168, 85, 247, 0.05);
        }

        .premium-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-success { background: var(--success); }
        .status-warning { background: var(--warning); }
        .status-danger { background: var(--danger); }
        .status-family { background: var(--family); }
        .status-sector { background: var(--sector); }
        .status-organization { background: var(--organization); }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.25rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-violet), var(--accent-violet));
            color: white;
            box-shadow: var(--glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-intense);
        }

        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-family { background: var(--family); color: white; }
        .btn-sector { background: var(--sector); color: white; }
        .btn-organization { background: var(--organization); color: white; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(76, 29, 149, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-violet), var(--accent-violet));
            width: 0%;
            transition: width 0.3s ease;
        }

        .scan-results {
            background: rgba(76, 29, 149, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            background: rgba(76, 29, 149, 0.1);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .metrics-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .metric-box {
            flex: 1;
            min-width: 120px;
            background: rgba(76, 29, 149, 0.2);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-violet);
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .family-member, .org-member {
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .org-member {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .age-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .age-group {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .age-group.active {
            background: var(--family);
            color: white;
        }

        .compliance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .compliance-card {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .compliance-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background: var(--glass-bg);
            margin: 5% auto;
            padding: 2rem;
            border: 1px solid var(--accent-violet);
            border-radius: 16px;
            width: 80%;
            max-width: 800px;
            backdrop-filter: blur(20px);
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: var(--text-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--accent-violet);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-card {
            background: rgba(76, 29, 149, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--glow);
        }

        @media (max-width: 768px) {
            .security-grid { grid-template-columns: 1fr; }
            .compliance-grid { grid-template-columns: 1fr; }
            .feature-grid { grid-template-columns: 1fr; }
            .metrics-row { flex-direction: column; }
            .dashboard-title { font-size: 2rem; }
            .nav-tabs { flex-wrap: wrap; gap: 0.5rem; }
            .nav-tab { font-size: 0.8rem; padding: 0.4rem 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <h2 style="color: var(--accent-violet); margin: 0;">🛡️ Advanced Security Center</h2>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('core')">Core Security</button>
                <button class="nav-tab" onclick="switchTab('family')">Family Protection</button>
                <button class="nav-tab" onclick="switchTab('sector')">Sector Compliance</button>
                <button class="nav-tab" onclick="switchTab('organization')">Organization</button>
                <button class="nav-tab" onclick="switchTab('ai')">AI Security</button>
                <button class="nav-tab" onclick="window.location.href='predictive-exposure-intel.html'" style="background: linear-gradient(45deg, #06b6d4, #3b82f6); color: white; border-color: #06b6d4;">⚡ Predictive Intel</button>
            </div>
        </div>
    </nav>
