<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Web Monitoring - Digital Footprint Eraser</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-bg: #0A0A0F;
            --danger-red: #EF4444;
            --warning-orange: #F59E0B;
            --success-green: #10B981;
            --primary-violet: #8B5CF6;
            --dark-purple: #1a0033;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --card-bg: rgba(139, 92, 246, 0.05);
            --border-color: rgba(139, 92, 246, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a0033 50%, #0d0015 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--danger-red), var(--warning-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-banner {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .status-card {
            flex: 1;
            min-width: 200px;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 2px solid;
            text-align: center;
        }

        .status-card.danger { border-color: var(--danger-red); }
        .status-card.warning { border-color: var(--warning-orange); }
        .status-card.safe { border-color: var(--success-green); }

        .status-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .status-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .monitoring-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .monitoring-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-icon {
            font-size: 2rem;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-violet);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .btn {
            padding: 0.8rem 1.6rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-violet), #A855F7);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, var(--danger-red), #DC2626);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        .breach-list {
            margin-top: 1rem;
        }

        .breach-item {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--danger-red);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .breach-item.warning {
            border-left-color: var(--warning-orange);
        }

        .breach-item.safe {
            border-left-color: var(--success-green);
        }

        .breach-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .breach-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .breach-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .breach-details {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .threat-feed {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--danger-red);
            border-radius: 12px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .threat-item {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .threat-item:last-child {
            border-bottom: none;
        }

        .threat-time {
            color: var(--warning-orange);
            margin-right: 1rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 4px solid rgba(139, 92, 246, 0.1);
            border-top: 4px solid var(--primary-violet);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert-box {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-green);
            color: var(--success-green);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.8rem 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .monitoring-grid {
                grid-template-columns: 1fr;
            }
            
            .status-banner {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Dashboard</a>

        <div class="header">
            <h1>🕵️ Dark Web Monitoring Center</h1>
            <p style="color: var(--text-secondary); font-size: 1.1rem;">Real-time monitoring of your digital footprint on the dark web</p>

            <div class="status-banner">
                <div class="status-card danger">
                    <div class="status-number" id="criticalAlerts">0</div>
                    <div class="status-label">Critical Alerts</div>
                </div>
                <div class="status-card warning">
                    <div class="status-number" id="warningAlerts">0</div>
                    <div class="status-label">Warnings</div>
                </div>
                <div class="status-card safe">
                    <div class="status-number" id="monitoredAssets">0</div>
                    <div class="status-label">Monitored Assets</div>
                </div>
            </div>
        </div>

        <div class="monitoring-grid">
            <!-- Email Breach Monitor -->
            <div class="monitoring-card">
                <div class="card-header">
                    <div class="card-icon">📧</div>
                    <div class="card-title">Email Breach Scanner</div>
                </div>

                <div class="input-group">
                    <label>Email Address to Monitor</label>
                    <input type="email" id="emailInput" placeholder="executive@company.com">
                </div>

                <button class="btn btn-primary" onclick="scanEmail()">Scan for Breaches</button>

                <div id="emailResults" class="breach-list" style="display: none;"></div>
            </div>

            <!-- Credential Monitor -->
            <div class="monitoring-card">
                <div class="card-header">
                    <div class="card-icon">🔐</div>
                    <div class="card-title">Credential Monitoring</div>
                </div>

                <div class="input-group">
                    <label>Username or Domain</label>
                    <input type="text" id="usernameInput" placeholder="username or domain.com">
                </div>

                <button class="btn btn-primary" onclick="scanCredentials()">Check Credentials</button>

                <div id="credentialResults" class="breach-list" style="display: none;"></div>
            </div>

            <!-- Data Marketplace Monitor -->
            <div class="monitoring-card">
                <div class="card-header">
                    <div class="card-icon">💰</div>
                    <div class="card-title">Data Marketplace Tracker</div>
                </div>

                <div class="input-group">
                    <label>Personal Information</label>
                    <input type="text" id="personalInfoInput" placeholder="Name, SSN, Phone">
                </div>

                <button class="btn btn-danger" onclick="scanMarketplace()">Scan Marketplaces</button>

                <div id="marketplaceResults" class="breach-list" style="display: none;"></div>
            </div>

            <!-- Threat Intelligence Feed -->
            <div class="monitoring-card">
                <div class="card-header">
                    <div class="card-icon">⚠️</div>
                    <div class="card-title">Live Threat Intelligence</div>
                </div>

                <button class="btn btn-primary" onclick="refreshThreatFeed()">Refresh Feed</button>

                <div id="threatFeed" class="threat-feed" style="margin-top: 1rem;">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading threat intelligence...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulated breach database
        const breachDatabase = {
            'test@example.com': [
                { name: 'LinkedIn Data Breach', date: '2021-06-22', records: '700M', type: 'Email, Phone, Location' },
                { name: 'Facebook Leak', date: '2021-04-03', records: '533M', type: 'Email, Phone, Name, Location' }
            ],
            'demo@company.com': [
                { name: 'Adobe Breach', date: '2013-10-04', records: '153M', type: 'Email, Password, Username' }
            ]
        };

        function scanEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const resultsDiv = document.getElementById('emailResults');

            if (!email) {
                alert('Please enter an email address');
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning dark web databases...</div>';
            resultsDiv.style.display = 'block';

            setTimeout(() => {
                const breaches = breachDatabase[email] || [];

                if (breaches.length === 0) {
                    resultsDiv.innerHTML = '<div class="alert-box alert-success">✅ Good news! No breaches found for this email address.</div>';
                    updateStats(0, 0);
                } else {
                    let html = '<div class="alert-box alert-danger">⚠️ ' + breaches.length + ' breach(es) detected!</div>';
                    
                    breaches.forEach(breach => {
                        html += `
                            <div class="breach-item">
                                <div class="breach-header">
                                    <div class="breach-name">${breach.name}</div>
                                    <div class="breach-date">${breach.date}</div>
                                </div>
                                <div class="breach-details">
                                    <strong>Records Exposed:</strong> ${breach.records}<br>
                                    <strong>Data Compromised:</strong> ${breach.type}
                                </div>
                            </div>
                        `;
                    });

                    resultsDiv.innerHTML = html;
                    updateStats(breaches.length, 0);
                }
            }, 2000);
        }

        function scanCredentials() {
            const username = document.getElementById('usernameInput').value.trim();
            const resultsDiv = document.getElementById('credentialResults');

            if (!username) {
                alert('Please enter a username or domain');
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Checking credential leaks...</div>';
            resultsDiv.style.display = 'block';

            setTimeout(() => {
                const hasLeaks = Math.random() > 0.5;

                if (!hasLeaks) {
                    resultsDiv.innerHTML = '<div class="alert-box alert-success">✅ No credential leaks detected for this identifier.</div>';
                    updateStats(0, 0);
                } else {
                    resultsDiv.innerHTML = `
                        <div class="alert-box alert-danger">⚠️ Credential exposure detected!</div>
                        <div class="breach-item warning">
                            <div class="breach-header">
                                <div class="breach-name">Credential Paste Site</div>
                                <div class="breach-date">Recent</div>
                            </div>
                            <div class="breach-details">
                                <strong>Source:</strong> Pastebin clone<br>
                                <strong>Action Required:</strong> Change passwords immediately
                            </div>
                        </div>
                    `;
                    updateStats(0, 1);
                }
            }, 2000);
        }

        function scanMarketplace() {
            const info = document.getElementById('personalInfoInput').value.trim();
            const resultsDiv = document.getElementById('marketplaceResults');

            if (!info) {
                alert('Please enter personal information to monitor');
                return;
            }

            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning dark web marketplaces...</div>';
            resultsDiv.style.display = 'block';

            setTimeout(() => {
                resultsDiv.innerHTML = `
                    <div class="alert-box alert-success">✅ No marketplace listings found for your information.</div>
                    <div class="breach-item safe">
                        <div class="breach-header">
                            <div class="breach-name">Monitoring Active</div>
                            <div class="breach-date">Real-time</div>
                        </div>
                        <div class="breach-details">
                            We are continuously monitoring 47 dark web marketplaces for your information.
                            You will be alerted immediately if any matches are detected.
                        </div>
                    </div>
                `;
                updateStats(0, 0);
            }, 2500);
        }

        function refreshThreatFeed() {
            const feedDiv = document.getElementById('threatFeed');
            feedDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching latest threats...</div>';

            setTimeout(() => {
                const threats = [
                    { time: '2 min ago', message: 'New credential dump detected on RaidForums mirror' },
                    { time: '15 min ago', message: 'Corporate database for sale - Healthcare sector' },
                    { time: '32 min ago', message: 'Executive PII leak detected - Financial services' },
                    { time: '1 hour ago', message: 'Social media account dump - 500K records' },
                    { time: '2 hours ago', message: 'Payment card data marketplace listing updated' },
                    { time: '3 hours ago', message: 'Government contractor breach discussed on forum' }
                ];

                let html = '';
                threats.forEach(threat => {
                    html += `
                        <div class="threat-item">
                            <span class="threat-time">[${threat.time}]</span>
                            <span>${threat.message}</span>
                        </div>
                    `;
                });

                feedDiv.innerHTML = html;
            }, 1500);
        }

        function updateStats(critical, warnings) {
            const currentCritical = parseInt(document.getElementById('criticalAlerts').textContent);
            const currentWarnings = parseInt(document.getElementById('warningAlerts').textContent);
            
            document.getElementById('criticalAlerts').textContent = currentCritical + critical;
            document.getElementById('warningAlerts').textContent = currentWarnings + warnings;
            document.getElementById('monitoredAssets').textContent = parseInt(document.getElementById('monitoredAssets').textContent) + 1;
        }

        // Auto-load threat feed on page load
        window.addEventListener('load', () => {
            setTimeout(refreshThreatFeed, 1000);
        });

        console.log('🕵️ Dark Web Monitoring System Initialized');
        console.log('⚠️ Monitoring 47 dark web sources');
        console.log('🔒 Real-time threat intelligence active');
    </script>
</body>
</html>
