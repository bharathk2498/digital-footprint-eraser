<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Digital Footprint Eraser</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0A0A0F 0%, #1a1a2e 50%, #16213e 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, #10B981, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #CBD5E1;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .status-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-text {
            color: #10B981;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .user-info {
            color: #CBD5E1;
            font-size: 0.9rem;
            font-family: monospace;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4C1D95, #8B5CF6);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #8B5CF6;
            border: 2px solid #8B5CF6;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: none;
        }

        .error-text {
            color: #EF4444;
            font-weight: 600;
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    
    <div class="container">
        <div class="success-icon" id="statusIcon">🔄</div>
        
        <h1 class="title" id="statusTitle">Verifying Email...</h1>
        
        <p class="subtitle" id="statusSubtitle">
            <span class="loading"></span>
            Please wait while we verify your email address...
        </p>
        
        <div class="status-box" id="statusBox" style="display: none;">
            <div class="status-text" id="statusText">Processing verification...</div>
            <div class="user-info" id="userInfo"></div>
        </div>
        
        <div class="error-box" id="errorBox">
            <div class="error-text" id="errorText">Verification failed</div>
        </div>
        
        <div class="actions" id="actions" style="display: none;">
            <a href="index.html" class="btn btn-primary">🛡️ Access Your Dashboard</a>
            <a href="email-test.html" class="btn btn-secondary">🧪 Test Email System</a>
        </div>
    </div>

    <!-- Include Database Integration -->
    <script src="database-integration.js"></script>

    <script>
        // Auto-verify email when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📧 Email verification page loaded');
            await handleEmailVerification();
        });

        async function handleEmailVerification() {
            try {
                // Wait for database to initialize
                await waitForDatabase();
                
                // Check URL parameters for verification tokens
                const urlParams = new URLSearchParams(window.location.search);
                const accessToken = urlParams.get('access_token');
                const refreshToken = urlParams.get('refresh_token');
                const type = urlParams.get('type');
                const error = urlParams.get('error');
                const errorDescription = urlParams.get('error_description');

                console.log('URL params:', { accessToken: !!accessToken, type, error });

                // Handle errors from URL
                if (error) {
                    showError('Verification failed: ' + (errorDescription || error));
                    return;
                }

                // If we have tokens, the user is verified
                if (accessToken && type === 'signup') {
                    // Get current user
                    const user = await window.dfDB.getCurrentUser();
                    
                    if (user) {
                        // Mark email as verified in our database
                        await window.dfDB.updateEmailVerificationStatus(user.id, true);
                        
                        showSuccess(user);
                    } else {
                        showError('User session not found after verification');
                    }
                } else if (type === 'signup') {
                    // Verification link was clicked but no tokens - might be expired
                    showError('Verification link may be expired. Please request a new one.');
                } else {
                    // Check if user is already signed in and verified
                    const user = await window.dfDB.getCurrentUser();
                    
                    if (user) {
                        const isVerified = await window.dfDB.checkEmailVerification();
                        if (isVerified) {
                            showSuccess(user);
                        } else {
                            showError('Email verification incomplete. Please check your email for the verification link.');
                        }
                    } else {
                        showError('No active user session. Please sign in and check your email for the verification link.');
                    }
                }
                
            } catch (error) {
                console.error('Email verification error:', error);
                showError('Verification failed: ' + error.message);
            }
        }

        async function waitForDatabase() {
            let attempts = 0;
            while (!window.dfDB?.supabase && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
        }

        function showSuccess(user) {
            console.log('✅ Email verification successful for:', user.email);
            
            // Update UI elements
            document.getElementById('statusIcon').textContent = '✅';
            document.getElementById('statusTitle').textContent = 'Email Verified Successfully!';
            document.getElementById('statusSubtitle').innerHTML = 'Your account is now fully activated and ready to use.';
            
            // Show status box
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
            document.getElementById('statusText').textContent = '🎉 Email verification complete!';
            document.getElementById('userInfo').innerHTML = `
                User: ${user.email}<br>
                Account ID: ${user.id}<br>
                Verified: ${new Date().toLocaleString()}
            `;
            
            // Show action buttons
            document.getElementById('actions').style.display = 'flex';
            
            // Auto-redirect after 5 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 5000);
            
            // Show countdown
            let countdown = 5;
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    document.getElementById('statusSubtitle').innerHTML = 
                        `Your account is now fully activated. Redirecting to dashboard in ${countdown} seconds...`;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        function showError(message) {
            console.error('❌ Email verification failed:', message);
            
            // Update UI elements
            document.getElementById('statusIcon').textContent = '❌';
            document.getElementById('statusTitle').textContent = 'Verification Failed';
            document.getElementById('statusSubtitle').textContent = '';
            
            // Show error box
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            document.getElementById('errorText').textContent = message;
            
            // Show action buttons
            document.getElementById('actions').style.display = 'flex';
            
            // Update action buttons for error state
            document.getElementById('actions').innerHTML = `
                <a href="index.html" class="btn btn-secondary">← Back to Main Site</a>
                <a href="email-test.html" class="btn btn-primary">🧪 Test Email System</a>
            `;
        }

        console.log('📧 Email verification handler ready');
    </script>
</body>
</html>
